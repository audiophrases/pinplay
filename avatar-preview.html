<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PinPlay Cup Avatar Customizer Preview</title>
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --accent: #6366F1;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
    }
    p.subtitle {
      color: var(--text-muted);
      margin: 0 0 24px 0;
    }
    .preview-container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }
    .avatar-stage {
      width: 200px;
      height: 200px;
      background: #0F172A;
      border-radius: 100px;
      border: 4px solid var(--accent);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .avatar-stage svg {
      width: 100%;
      height: 100%;
    }
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0F172A;
      padding: 8px 12px;
      border-radius: 12px;
    }
    .control-label {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      width: 100px;
    }
    .control-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: flex-end;
    }
    .nav-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .nav-btn:hover {
      background: #4F46E5;
    }
    .item-name {
      font-size: 13px;
      font-weight: 500;
      width: 140px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .random-btn {
      margin-top: 18px;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(16,185,129,0.3);
      transition: transform 0.1s, background 0.2s;
    }
    .random-btn:hover {
      background: #059669;
    }
    .random-btn:active {
      transform: scale(0.98);
    }
    .color-swatches {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 170px;
      padding: 2px 0;
    }
    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
    }
    .swatch.selected {
      border-color: white;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <h1>🎮 PinPlay Cup Student Avatar Preview</h1>
  <p class="subtitle">This preview renders the exact avatar options available to students after entering their PIN.</p>

  <div class="preview-container">
    <div class="avatar-stage" id="avatarDisplay"></div>

    <div class="controls" id="controlsContainer"></div>

    <button class="random-btn" id="randomBtn">🎲 Surprise Me!</button>
  </div>

  <!-- Load inlined avatar definitions generated by build-cup-assets.mjs -->
  <script src="cup/avatar-parts.js"></script>

  <script>
    const AV = window.CUP_AVATAR;

    // Current selection indices
    const state = {
      skin: 0,
      hair: 0,
      hairColor: 0,
      eyes: 0,
      mouth: 0,
      glasses: 0,
      hat: 0,
      shirt: 0
    };

    const categories = [
      { key: 'skin', label: 'Skin Color', type: 'color', items: AV.skins },
      { key: 'hair', label: 'Hair Style', type: 'part', items: AV.parts.hair },
      { key: 'hairColor', label: 'Hair Color', type: 'color', items: AV.hairColors },
      { key: 'eyes', label: 'Eyes', type: 'part', items: AV.parts.eyes },
      { key: 'mouth', label: 'Mouth', type: 'part', items: AV.parts.mouth },
      { key: 'glasses', label: 'Glasses', type: 'part', items: AV.parts.glasses },
      { key: 'hat', label: 'Hat', type: 'part', items: AV.parts.hat },
      { key: 'shirt', label: 'Shirt', type: 'part', items: AV.parts.shirt }
    ];

    function renderAvatar() {
      const hair = AV.parts.hair[state.hair] || { front: '', back: '' };
      const shirt = AV.parts.shirt[state.shirt]?.svg || '';
      const eyes = AV.parts.eyes[state.eyes]?.svg || '';
      const mouth = AV.parts.mouth[state.mouth]?.svg || '';
      const glasses = AV.parts.glasses[state.glasses]?.svg || '';
      const hat = AV.parts.hat[state.hat]?.svg || '';

      const body = [
        shirt,
        AV.base.neck,
        hair.back || '',
        AV.base.head,
        AV.base.cheeks,
        eyes,
        mouth,
        hair.front || '',
        glasses,
        hat
      ].join('')
      .replace(/#00FFFF/gi, AV.skins[state.skin])
      .replace(/#FF00FF/gi, AV.hairColors[state.hairColor]);

      document.getElementById('avatarDisplay').innerHTML =
        `<svg viewBox="${AV.viewBox}">${body}</svg>`;
    }

    function createControls() {
      const container = document.getElementById('controlsContainer');
      container.innerHTML = '';

      categories.forEach(cat => {
        const row = document.createElement('div');
        row.className = 'control-row';

        const label = document.createElement('div');
        label.className = 'control-label';
        label.textContent = cat.label;
        row.appendChild(label);

        const selector = document.createElement('div');
        selector.className = 'control-selector';

        if (cat.type === 'color') {
          const swatches = document.createElement('div');
          swatches.className = 'color-swatches';
          cat.items.forEach((color, idx) => {
            const sw = document.createElement('div');
            sw.className = `swatch ${state[cat.key] === idx ? 'selected' : ''}`;
            sw.style.backgroundColor = color;
            sw.onclick = () => {
              state[cat.key] = idx;
              createControls();
              renderAvatar();
            };
            swatches.appendChild(sw);
          });
          selector.appendChild(swatches);
        } else {
          const prevBtn = document.createElement('button');
          prevBtn.className = 'nav-btn';
          prevBtn.textContent = '◀';
          prevBtn.onclick = () => {
            state[cat.key] = (state[cat.key] - 1 + cat.items.length) % cat.items.length;
            updateItemLabel(cat.key);
            renderAvatar();
          };

          const nameLabel = document.createElement('span');
          nameLabel.className = 'item-name';
          nameLabel.id = `label-${cat.key}`;
          nameLabel.textContent = cat.items[state[cat.key]]?.name || cat.items[state[cat.key]]?.id || 'Default';

          const nextBtn = document.createElement('button');
          nextBtn.className = 'nav-btn';
          nextBtn.textContent = '▶';
          nextBtn.onclick = () => {
            state[cat.key] = (state[cat.key] + 1) % cat.items.length;
            updateItemLabel(cat.key);
            renderAvatar();
          };

          selector.appendChild(prevBtn);
          selector.appendChild(nameLabel);
          selector.appendChild(nextBtn);
        }

        row.appendChild(selector);
        container.appendChild(row);
      });
    }

    function updateItemLabel(key) {
      const cat = categories.find(c => c.key === key);
      const label = document.getElementById(`label-${key}`);
      if (label && cat) {
        label.textContent = cat.items[state[key]]?.name || cat.items[state[key]]?.id || 'Default';
      }
    }

    function randomize() {
      categories.forEach(cat => {
        state[cat.key] = Math.floor(Math.random() * cat.items.length);
      });
      createControls();
      renderAvatar();
    }

    document.getElementById('randomBtn').onclick = randomize;

    // Initial render
    createControls();
    renderAvatar();
  </script>
</body>
</html>
