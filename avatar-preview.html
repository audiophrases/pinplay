<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PinPlay Cup Avatar Studio & Live Editor</title>
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --accent: #6366F1;
      --accent-hover: #4F46E5;
      --success: #10B981;
      --danger: #EF4444;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 6px 0; font-size: 26px; }
    .subtitle { color: var(--text-muted); margin: 0; font-size: 14px; }
    
    .status-bar {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }
    .status-bar.connected { background: rgba(16,185,129,0.15); color: #34D399; border: 1px solid rgba(16,185,129,0.3); }
    .status-bar.disconnected { background: rgba(239,68,68,0.15); color: #F87171; border: 1px solid rgba(239,68,68,0.3); }

    .app-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    /* Left Panel: Preview + Part Controls */
    .stage-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar-stage {
      width: 220px;
      height: 220px;
      background: #0F172A;
      border-radius: 50%;
      border: 4px solid var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }
    .avatar-stage svg { width: 100%; height: 100%; }

    .controls-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0F172A;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    .control-row.active-cat {
      border-color: var(--accent);
      background: #182238;
    }
    .control-label {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .control-selector {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover { background: var(--accent-hover); }
    .item-name {
      font-size: 12px;
      font-weight: 500;
      width: 110px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .random-btn {
      margin-top: 14px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    /* Right Panel: Active Part Editor & Management */
    .editor-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .part-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .part-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }
    .file-path {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
      word-break: break-all;
    }

    .action-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: rgba(239,68,68,0.2); color: #F87171; border: 1px solid rgba(239,68,68,0.4); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-secondary { background: #334155; color: white; }
    .btn-secondary:hover { background: #475569; }

    /* SVG Code / Drawing Canvas */
    .editor-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab-content { display: none; }
    .tab-content.active { display: flex; flex-direction: column; gap: 12px; }

    textarea.svg-code-input {
      width: 100%;
      height: 220px;
      background: #090D16;
      color: #A5B4FC;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
    }

    /* Simple Touch-up Canvas */
    .canvas-wrap {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .drawing-canvas-stage {
      width: 250px;
      height: 260px;
      background: #090D16;
      border: 1px solid var(--border);
      border-radius: 8px;
      position: relative;
    }
    #drawCanvas {
      width: 250px;
      height: 260px;
      cursor: crosshair;
    }
    .canvas-tools {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tool-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tool-group label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    input[type="color"] { border: none; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; background: none; }

    /* New Part Modal / Form */
    .new-part-box {
      background: #090D16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .form-row input, .form-row select {
      background: #1E293B;
      border: 1px solid var(--border);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎨 PinPlay Cup Avatar Studio</h1>
    <p class="subtitle">Local Live Editor: Modify, draw, add, or delete avatar assets directly in <code>PinPlayCupMediaDesign</code>.</p>
    <div id="connectionStatus" class="status-bar disconnected">⚡ Checking Local Server...</div>
  </header>

  <div class="app-layout">
    <!-- Left: Preview & Navigation -->
    <div class="panel stage-card">
      <div class="avatar-stage" id="avatarDisplay"></div>

      <div class="controls-list" id="controlsContainer"></div>

      <button class="random-btn" id="randomBtn">🎲 Surprise Me!</button>
    </div>

    <!-- Right: Active Part Editor -->
    <div class="panel editor-card">
      <div class="part-header">
        <div>
          <h2 class="part-title" id="activePartTitle">Select a part to edit</h2>
          <div class="file-path" id="activePartPath">Path: --</div>
        </div>
        <div class="action-toolbar">
          <button class="btn btn-primary" id="savePartBtn">💾 Save Changes</button>
          <button class="btn btn-danger" id="deletePartBtn">🗑️ Delete Part</button>
        </div>
      </div>

      <!-- Tabs: Code vs Touch-up -->
      <div class="editor-tabs">
        <button class="tab-btn active" onclick="switchTab('code')">📄 SVG Code</button>
        <button class="tab-btn" onclick="switchTab('draw')">✏️ Draw / Touch-up</button>
        <button class="tab-btn" onclick="switchTab('add')">➕ Add New Item</button>
      </div>

      <!-- Tab 1: Code Editor -->
      <div id="tab-code" class="tab-content active">
        <textarea id="svgCodeInput" class="svg-code-input" spellcheck="false" placeholder="Select a category item to edit SVG code..."></textarea>
      </div>

      <!-- Tab 2: Canvas Touch-up -->
      <div id="tab-draw" class="tab-content">
        <div class="canvas-wrap">
          <div class="drawing-canvas-stage">
            <canvas id="drawCanvas" width="250" height="260"></canvas>
          </div>
          <div class="canvas-tools">
            <div class="tool-group">
              <label>Stroke Color</label>
              <input type="color" id="brushColor" value="#FF00FF">
            </div>
            <div class="tool-group">
              <label>Brush Size</label>
              <input type="range" id="brushSize" min="1" max="20" value="4">
            </div>
            <button class="btn btn-secondary" id="clearCanvasBtn">🧹 Clear Touch-ups</button>
            <button class="btn btn-primary" id="applyCanvasBtn">Apply to SVG</button>
          </div>
        </div>
      </div>

      <!-- Tab 3: Add New Part -->
      <div id="tab-add" class="tab-content">
        <div class="new-part-box">
          <h4 style="margin:0 0 6px 0;">Add New Asset to PinPlayCupMediaDesign</h4>
          <div class="form-row">
            <label style="width:70px; font-size:12px;">Category:</label>
            <select id="newCatSelect">
              <option value="hat">Hat (hat-*.svg)</option>
              <option value="glasses">Glasses (glasses-*.svg)</option>
              <option value="mouth">Mouth (mouth-*.svg)</option>
              <option value="hair">Hair (hair-*.svg)</option>
              <option value="shirt">Shirt (shirt-*.svg)</option>
              <option value="eyes">Eyes (eyes-*.svg)</option>
            </select>
          </div>
          <div class="form-row">
            <label style="width:70px; font-size:12px;">Item ID:</label>
            <input type="text" id="newItemId" placeholder="e.g. pirate-cap" style="flex:1;">
          </div>
          <div class="form-row">
            <button class="btn btn-primary" id="createNewPartBtn">✨ Create New Part</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Inlined data for fallback preview -->
  <script src="cup/avatar-parts.js"></script>

  <script>
    const SERVER_URL = 'http://localhost:3005';
    let isConnected = false;
    let catalog = null; // Live file list from server

    const state = {
      skin: 0, hair: 0, hairColor: 0, eyes: 0, mouth: 0, glasses: 0, hat: 0, shirt: 0
    };

    let activeCat = 'hat';

    const categories = [
      { key: 'hat', label: 'Hat', items: [] },
      { key: 'glasses', label: 'Glasses', items: [] },
      { key: 'hair', label: 'Hair', items: [] },
      { key: 'eyes', label: 'Eyes', items: [] },
      { key: 'mouth', label: 'Mouth', items: [] },
      { key: 'shirt', label: 'Shirt', items: [] },
    ];

    // Check backend connection
    async function checkServer() {
      const statusEl = document.getElementById('connectionStatus');
      try {
        const res = await fetch(`${SERVER_URL}/api/catalog`);
        if (res.ok) {
          catalog = await res.json();
          isConnected = true;
          statusEl.textContent = '⚡ Connected to Local Studio Server (Edit Mode Active)';
          statusEl.className = 'status-bar connected';
          loadCatalogIntoCategories();
          return;
        }
      } catch(e) {}
      
      isConnected = false;
      statusEl.textContent = '⚠️ Server offline. Run `node scripts/studio-server.js` in pinplay to enable live saving/deleting.';
      statusEl.className = 'status-bar disconnected';
      loadFallbackCategories();
    }

    function loadCatalogIntoCategories() {
      if (!catalog) return;
      categories.forEach(cat => {
        cat.items = catalog[cat.key] || [];
      });
      createControls();
      selectCategory(activeCat);
      renderAvatar();
    }

    function loadFallbackCategories() {
      const AV = window.CUP_AVATAR;
      categories.forEach(cat => {
        if (cat.key === 'hair') cat.items = AV.parts.hair;
        else if (AV.parts[cat.key]) cat.items = AV.parts[cat.key];
      });
      createControls();
      renderAvatar();
    }

    function renderAvatar() {
      const AV = window.CUP_AVATAR;
      const getSvg = (catKey, idx) => {
        const cat = categories.find(c => c.key === catKey);
        if (!cat || !cat.items[idx]) return '';
        const item = cat.items[idx];
        return item.svg || item.front || '';
      };

      const hairObj = categories.find(c => c.key === 'hair')?.items[state.hair] || {};
      const hairBack = hairObj.back || '';
      const hairFront = hairObj.front || hairObj.svg || '';

      const body = [
        getSvg('shirt', state.shirt),
        AV.base.neck,
        hairBack,
        AV.base.head,
        AV.base.cheeks,
        getSvg('eyes', state.eyes),
        getSvg('mouth', state.mouth),
        hairFront,
        getSvg('glasses', state.glasses),
        getSvg('hat', state.hat)
      ].join('')
      .replace(/#00FFFF/gi, AV.skins[state.skin] || '#F8D9C5')
      .replace(/#FF00FF/gi, AV.hairColors[state.hairColor] || '#292D43');

      document.getElementById('avatarDisplay').innerHTML =
        `<svg viewBox="${AV.viewBox}">${body}</svg>`;
    }

    function createControls() {
      const container = document.getElementById('controlsContainer');
      container.innerHTML = '';

      categories.forEach(cat => {
        const row = document.createElement('div');
        row.className = `control-row ${activeCat === cat.key ? 'active-cat' : ''}`;

        const label = document.createElement('div');
        label.className = 'control-label';
        label.textContent = cat.label;
        label.onclick = () => selectCategory(cat.key);
        row.appendChild(label);

        const selector = document.createElement('div');
        selector.className = 'control-selector';

        const prevBtn = document.createElement('button');
        prevBtn.className = 'nav-btn';
        prevBtn.textContent = '◀';
        prevBtn.onclick = () => {
          state[cat.key] = (state[cat.key] - 1 + cat.items.length) % Math.max(1, cat.items.length);
          selectCategory(cat.key);
          renderAvatar();
        };

        const nameLabel = document.createElement('span');
        nameLabel.className = 'item-name';
        nameLabel.id = `label-${cat.key}`;
        const curItem = cat.items[state[cat.key]];
        nameLabel.textContent = curItem?.name || curItem?.id || 'None';

        const nextBtn = document.createElement('button');
        nextBtn.className = 'nav-btn';
        nextBtn.textContent = '▶';
        nextBtn.onclick = () => {
          state[cat.key] = (state[cat.key] + 1) % Math.max(1, cat.items.length);
          selectCategory(cat.key);
          renderAvatar();
        };

        selector.appendChild(prevBtn);
        selector.appendChild(nameLabel);
        selector.appendChild(nextBtn);

        row.appendChild(selector);
        container.appendChild(row);
      });
    }

    function selectCategory(catKey) {
      activeCat = catKey;
      createControls();

      const cat = categories.find(c => c.key === catKey);
      const item = cat?.items[state[catKey]];

      document.getElementById('activePartTitle').textContent = `${cat?.label}: ${item?.name || item?.id || 'None'}`;
      document.getElementById('activePartPath').textContent = item?.filePath ? `Path: ${item.filePath}` : 'Path: Inlined JS';

      const codeInput = document.getElementById('svgCodeInput');
      codeInput.value = item?.svg || item?.front || '';

      // Redraw canvas background
      initCanvas();
    }

    // Save changes to current part
    document.getElementById('savePartBtn').onclick = async () => {
      if (!isConnected) { alert('Studio Server offline!'); return; }
      const cat = categories.find(c => c.key === activeCat);
      const item = cat?.items[state[activeCat]];
      if (!item || !item.filePath) { alert('No active editable file selected!'); return; }

      const svgContent = document.getElementById('svgCodeInput').value;
      try {
        const res = await fetch(`${SERVER_URL}/api/save-part`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filePath: item.filePath, content: svgContent })
        });
        const data = await res.json();
        if (data.success) {
          item.svg = svgContent;
          renderAvatar();
          alert('Saved changes to disk & synced app build!');
        } else {
          alert('Save failed: ' + data.error);
        }
      } catch(e) { alert('Failed to connect to server.'); }
    };

    // Delete current part
    document.getElementById('deletePartBtn').onclick = async () => {
      if (!isConnected) { alert('Studio Server offline!'); return; }
      const cat = categories.find(c => c.key === activeCat);
      const item = cat?.items[state[activeCat]];
      if (!item || !item.filePath) { alert('No active file selected!'); return; }

      if (!confirm(`Are you sure you want to delete ${item.id} (${item.filePath})?`)) return;

      try {
        const res = await fetch(`${SERVER_URL}/api/delete-part`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filePath: item.filePath })
        });
        const data = await res.json();
        if (data.success) {
          alert('Deleted asset!');
          await checkServer();
        } else {
          alert('Delete failed: ' + data.error);
        }
      } catch(e) { alert('Failed to connect.'); }
    };

    // Create New Part
    document.getElementById('createNewPartBtn').onclick = async () => {
      if (!isConnected) { alert('Studio Server offline!'); return; }
      const category = document.getElementById('newCatSelect').value;
      const itemId = document.getElementById('newItemId').value.trim();
      if (!itemId) { alert('Please enter an Item ID!'); return; }

      const defaultSvg = `<path d="M 30 20 L 70 20 L 50 40 Z" fill="#FF00FF" stroke="#000" stroke-width="2"/>`;

      try {
        const res = await fetch(`${SERVER_URL}/api/create-part`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category, itemId, content: defaultSvg })
        });
        const data = await res.json();
        if (data.success) {
          alert('Created new asset!');
          document.getElementById('newItemId').value = '';
          await checkServer();
        } else {
          alert('Create failed: ' + data.error);
        }
      } catch(e) { alert('Create failed.'); }
    };

    // Tab switching
    window.switchTab = function(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
    };

    // Canvas drawing / touch-up logic
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function initCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#090D16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    canvas.onmousedown = (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
    canvas.onmousemove = (e) => {
      if (!isDrawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.strokeStyle = document.getElementById('brushColor').value;
      ctx.lineWidth = document.getElementById('brushSize').value;
      ctx.lineCap = 'round';
      ctx.stroke();
    };
    canvas.onmouseup = () => isDrawing = false;

    document.getElementById('clearCanvasBtn').onclick = initCanvas;
    document.getElementById('applyCanvasBtn').onclick = () => {
      // Append a simple path to SVG input
      const codeInput = document.getElementById('svgCodeInput');
      codeInput.value += `\n<!-- Touch-up layer -->\n<circle cx="50" cy="20" r="10" fill="${document.getElementById('brushColor').value}" />`;
      renderAvatar();
    };

    document.getElementById('randomBtn').onclick = () => {
      categories.forEach(cat => {
        state[cat.key] = Math.floor(Math.random() * cat.items.length);
      });
      createControls();
      selectCategory(activeCat);
      renderAvatar();
    };

    // Initial check
    checkServer();
  </script>
</body>
</html>
